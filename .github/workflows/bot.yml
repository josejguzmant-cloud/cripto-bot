name: Bot de cripto

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      prueba:
        description: "Enviar un mensaje de prueba a Telegram"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: cripto-bot
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Revisar el mercado
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: |
          if [ "${{ inputs.prueba }}" = "true" ]; then
            python bot.py --prueba
          else
            python bot.py
          fi

      - name: Guardar memoria del bot
        if: always()
        run: |
          git config user.name "cripto-bot"
          git config user.email "cripto-bot@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Memoria del bot"
            git pull --rebase -X theirs || true
            git push
          fi
